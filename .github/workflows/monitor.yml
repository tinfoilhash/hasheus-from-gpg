name: monitor

# checks the keys and every package against the live sources each day, without publishing anything, to catch upstream
# changes (a new page layout, a new signer, an expired or removed key) when they happen.
on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    defaults:
      run:
        # `shell: bash` adds pipefail, which the default shell doesn't.
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      # tinfoil hash's npub, to check what's already published.
      NPUB: npub1gm7yl6a9xsnkg2lepuaf4hddv2yvwlun5atxjtye3pu5l0vh5kes8ef4r5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg libxml2-utils
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          brew install hq jaq nak

      - name: check keys
        run: |
          set +e
          ./check_keys.sh --import | tee keys.log
          status=${PIPESTATUS[0]}

          {
            echo '## keys'
            grep -E '^  (problem|warning):' keys.log || echo 'no problems or warnings'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"

      # runs even when the key check finds problems, since it imports the keys this needs.
      - name: dry run
        if: success() || failure()
        run: |
          set +e
          DRY_RUN=1 ./verify_all.sh > dry-run.log 2>&1
          status=$?
          cat dry-run.log

          # a failed signature or hash check stops that package's run, so these count packages, and a stopped package
          # isn't checked past the release that stopped it.
          {
            echo '## dry run'
            echo "- packages stopped by a release not signed by a listed key: $(grep -c 'gpg signatures verification failed' dry-run.log)"
            echo "- packages stopped by a file that failed its hash check: $(grep -c 'file not verified' dry-run.log)"
            echo "- releases skipped for a missing manifest or signature: $(grep -c 'file does not exist, skipping' dry-run.log)"
            echo "- files not published yet: $(grep -c 'dry run: would publish' dry-run.log)"
          } >> "$GITHUB_STEP_SUMMARY"

          # coldcard checks its signatures before listing releases, so a failure there has no release to name.
          awk '
            /^--- verifying / { package = substr($0, 15); release = "" }
            /^----- new release: / { release = " at " substr($0, 20) }
            /gpg signatures verification failed|file not verified/ { print "::error::" package " stopped" release ": " $0 }
          ' dry-run.log

          # some releases are never signed, so a missing manifest or signature is a warning, not a failure. a renamed
          # manifest shows up here too.
          if grep -q 'file does not exist, skipping' dry-run.log; then
            echo '::warning::a release was skipped for a missing manifest or signature'
          fi

          exit "$status"
