name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macos runs the scripts under bash 3.2, which is what catches compatibility mistakes.
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install dependencies (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg libxml2-utils
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          brew install bats-core hq jaq shellcheck

      - name: install dependencies (macos)
        if: runner.os == 'macOS'
        run: brew install bats-core gnupg hq jaq shellcheck

      - name: lint
        run: shellcheck test/fakes/* test/*.bash test/*.bats verify_all.sh common/*.sh packages/*/verify.sh

      - name: test
        run: bats test
