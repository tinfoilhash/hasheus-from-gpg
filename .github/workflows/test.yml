name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        # `shell: bash` adds pipefail, which the default shell doesn't.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg libxml2-utils
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          brew install actionlint bats-core hq jaq shellcheck shfmt

      - name: lint
        run: |
          shfmt -d .
          shfmt -f . | tr '\n' '\0' | xargs -0 shellcheck
          actionlint

          # nothing else checks line length. lines with a url are exempt.
          { shfmt -f .; ls .github/workflows/*.yml; } | tr '\n' '\0' \
            | xargs -0 awk 'length > 80 && !/:\/\// {
              print FILENAME ":" FNR ": over 80 characters"
              failed = 1
            } END { exit failed }'

      - name: test
        run: bats test
